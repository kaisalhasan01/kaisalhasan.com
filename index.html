<style>
:root{
  --bg:#f9f6f0; --bg2:#ffffff; --bg3:#efebe3; --ink:#1a1a1a; --ink2:#55585e; --line:#dcd7cc;
  --red:#c8102e; --red-ink:#a80d26; --on-red:#ffffff; --yellow:#ffc915; --on-yellow:#1a1a1a; --green:#15803d;

  --band:#1d1e21; --band-ink:#f3efe7; --band-ink2:#b5b1a9; --band-line:#3a3b3f; --band-btn:#2a2b2f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --bg2:#1a1b1e; --bg3:#222428; --ink:#ecebe7; --ink2:#a3a7ad; --line:#2e3035;
    --red:#e0263f; --red-ink:#ff7180; --yellow:#ffd23f; --green:#4ade80;
    --band:#25272c; --band-line:#3a3d44; --band-btn:#30333a;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --bg2:#1a1b1e; --bg3:#222428; --ink:#ecebe7; --ink2:#a3a7ad; --line:#2e3035;
  --red:#e0263f; --red-ink:#ff7180; --yellow:#ffd23f; --green:#4ade80;
  --band:#25272c; --band-line:#3a3d44; --band-btn:#30333a;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
p,li,figcaption{text-wrap:pretty}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--bg2);color:var(--ink);padding:8px 12px;z-index:40}
.skip:focus{left:8px}
html{scroll-padding-top:90px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:Barlow,sans-serif;line-height:1.15;overflow-wrap:break-word}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:1440px}
@media(min-width:720px){.wrap{padding:0 40px}}
@media(max-width:720px){body{font-size:16px}h1.page{font-size:1.8rem}h2{font-size:1.35rem}.lead{font-size:1rem}.who h1{font-size:1.9rem}.who .title{font-size:1rem}.job h3{font-size:1.1rem}section{padding:40px 0}}
.muted{color:var(--ink2)}

/* menu band */
nav{background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:30;transition:transform .25s ease}
nav.hide{transform:translateY(-100%)}
@media (prefers-reduced-motion: reduce){nav{transition:none}}
nav .wrap{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.15rem Barlow;letter-spacing:.02em}
/* logo: the ISO first-angle projection symbol from the drawing title block */
.brand svg{width:40px;height:20px;flex:none;overflow:visible}
.brand svg .o{fill:none;stroke:var(--band-ink);stroke-width:1.6;stroke-linejoin:round}
.brand svg .c{stroke:var(--red);stroke-width:1.1;stroke-dasharray:6 2 1.5 2}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links a{text-decoration:none;font:600 1.08rem Barlow;padding:8px 14px;border-radius:4px;color:var(--band-ink)}
.nav-links a:hover{background:var(--band-btn)}
.nav-links a.on{background:var(--band-ink);color:var(--band)}
.tools{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:6px;padding:6px 10px;font:600 .82rem Barlow;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--red);color:var(--red-ink)}
nav .chip{background:var(--band-btn);border-color:var(--band-line);color:var(--band-ink)}
nav .chip[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
@media(max-width:720px){nav .wrap{padding-top:10px;row-gap:8px}.nav-links{order:3;width:100%;padding-bottom:10px;flex-wrap:nowrap;gap:2px;justify-content:space-between}.nav-links a{padding:6px 8px;font-size:min(1rem,4.1vw);white-space:nowrap}}

/* back link */
.back{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-top:26px;font-weight:600}
.back a{text-decoration:none}
.back a:hover{color:var(--red-ink);text-decoration:underline}
.back .sep{color:var(--line)}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:4px;font:600 .98rem Barlow;text-decoration:none;border:1px solid var(--line);background:var(--bg2);color:var(--ink);max-width:100%;white-space:nowrap;cursor:pointer;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink2);background:var(--bg3)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn:active{transform:translateY(1px)}
.status{display:inline-block;font:600 .8rem Barlow;letter-spacing:.01em;padding:2px 8px;border-radius:3px;white-space:nowrap}
.status.active{background:var(--red);color:var(--on-red)}
.status.wip{background:var(--yellow);color:var(--on-yellow)}
.status.ship{border:1px solid var(--ink2)}
.status.concept{border:1px dashed var(--ink2);color:var(--ink2)}

/* layout */
section{padding:56px 0}
section + section{border-top:1px solid var(--line)}
h1.page{font-size:clamp(2rem,5vw,2.8rem);font-weight:600;margin:16px 0 10px}
.lead{max-width:40em;color:var(--ink);font-size:1.08rem}
h2{font-size:1.6rem;font-weight:600;margin-bottom:22px}
h3{font-size:1.2rem;font-weight:600}

/* home hero */
.hero{display:grid;gap:22px;padding-top:clamp(32px,6vw,72px);padding-bottom:clamp(44px,6vw,72px);grid-template-columns:minmax(0,1fr);align-items:start}
.hero + section{border-top:1px solid var(--line)}

.who{display:flex;gap:22px;align-items:center}

.who h1{font-size:clamp(2.2rem,5vw,3.3rem);font-weight:700;letter-spacing:-.01em}
.who .title{font:600 clamp(1.05rem,2vw,1.25rem) Barlow;color:var(--ink2);margin-top:6px;max-width:22em}

.spec{border:1.5px solid var(--ink);align-self:start}
.spec h2{font:500 .72rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);padding:8px 14px;margin:0;border-bottom:1px solid var(--ink)}
.spec dl div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
.spec dl div:last-child{border-bottom:0}
.spec dt{font:500 .72rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding-top:3px}
.stack{display:grid;gap:8px}
.stack div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:.95rem}
.stack dt{font-weight:600}
.stack dd{color:var(--ink2)}

/* start page: featured project, project list, image and text pairs */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h2{margin:0}

.head a:hover{text-decoration:underline}

a.feature img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
a.feature h3{font-size:clamp(1.35rem,2.4vw,1.75rem);margin:10px 0 10px}
a.feature p{max-width:32em}
a.feature .more,a.pair .more{display:inline-block;margin-top:14px;font:600 .95rem Barlow;color:var(--red-ink)}
a.feature:hover h3,a.pair:hover h3{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
ul.morelist{list-style:none;margin-top:36px;border-top:1px solid var(--line)}
ul.morelist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
ul.morelist b{font:600 1.05rem Barlow}
ul.morelist small{grid-column:1;color:var(--ink2);font-size:.92rem}
ul.morelist .status{grid-row:1/span 2;grid-column:2}
ul.morelist a:hover b{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
a.pair{display:grid;gap:18px 36px;grid-template-columns:minmax(0,1fr);text-decoration:none;align-items:center}
@media(min-width:860px){a.pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}a.pair.flip .pic{order:2}}
a.pair img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px}
a.pair h3{font-size:1.35rem;margin-bottom:10px}
a.pair p{max-width:32em}

/* projects list */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0}
.plist{border-top:1px solid var(--line)}
a.prow{display:grid;grid-template-columns:minmax(0,1fr);gap:10px 28px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none}
@media(min-width:760px){a.prow{grid-template-columns:240px minmax(0,1fr) auto}}
a.prow img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
a.prow .noimg{aspect-ratio:16/10;border-radius:4px;border:1px dashed var(--line)}
a.prow:hover h3{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
a.prow p{color:var(--ink2);font-size:.95rem;margin-top:6px}
a.prow .meta{font-size:.88rem;color:var(--ink2);margin-top:8px}

/* project page */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:.95rem}
@media(min-width:760px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.facts dt{color:var(--ink2);font-weight:600;font-size:.88rem}
figure{margin:0}
figure img{width:100%;height:auto;border-radius:4px;border:1px solid var(--line)}
figure.lead-media{display:table;max-width:100%;margin:0 auto}
figure.lead-media figcaption{display:table-caption;caption-side:bottom}
figure.lead-media img{width:auto;max-width:100%;max-height:min(62vh,540px)}
figcaption{font-size:.9rem;color:var(--ink2);margin-top:8px}
table.res{width:100%;border-collapse:collapse;font-size:.95rem}
table.res th,table.res td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.res th{font:600 .88rem Barlow;color:var(--ink2)}
table.res .n{text-align:right;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.story > div{display:grid;gap:6px 40px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
.story > div:first-child{padding-top:0}
.story > div:last-child{border:0}
@media(min-width:860px){.story > div{grid-template-columns:180px minmax(0,1fr)}}
.story h3{font-size:1.05rem;color:var(--ink2)}
.story p,.story li{max-width:42em}
.story ul{margin-left:20px;display:grid;gap:6px}
.figs{display:grid;gap:28px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:860px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.figs .wide{grid-column:1/-1}}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 8px;border-top:1px solid var(--line)}
.pager a{text-decoration:none;font:600 1rem Barlow}
.pager a:hover{color:var(--red-ink)}
.pager small{display:block;color:var(--ink2);font:400 .85rem "Source Sans 3"}

/* other pages */
.job{display:grid;gap:6px 40px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
.job:first-child{padding-top:0}
.job:last-child{border:0}
@media(min-width:860px){.job{grid-template-columns:180px minmax(0,1fr)}}
.job .when{color:var(--ink2)}
.job h3{font-size:1.25rem}
.job .org{font-weight:600;color:var(--red-ink)}
.job ul{margin:10px 0 0 20px;display:grid;gap:6px}
.job figure{margin-top:18px;max-width:400px}
.other div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.other div:last-child{border:0}
.wide img{max-height:520px;object-fit:cover;object-position:50% 60%}
.two{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.two p{margin-bottom:14px;max-width:38em}
.roles > div{padding:14px 0;border-bottom:1px solid var(--line)}
.roles > div:last-child{border:0}
.roles .when{color:var(--ink2);font-size:.92rem}
.photos{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
.photos img{aspect-ratio:4/3;object-fit:cover}
.courses{columns:1;column-gap:32px;font-size:.95rem}
@media(min-width:720px){.courses{columns:2}}
.courses li{break-inside:avoid;margin:0 0 6px 18px}
.edu > div{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.edu > div:last-child{border:0}
.edu p{font-size:.95rem}
.edu img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#fff;flex:none;border:0}
.edu .ph{width:48px;height:48px;border-radius:50%;flex:none;background:var(--bg3)}

/* contact band */
footer{margin-top:48px;background:var(--band);color:var(--band-ink);border-top:3px solid var(--red);padding:48px 0 40px}
.foot{display:grid;gap:32px;grid-template-columns:minmax(0,1fr);align-items:end}
@media(min-width:900px){.foot{grid-template-columns:minmax(0,1fr) 440px}}
.contact h2{margin-bottom:6px}
.contact p{color:var(--band-ink2);margin-bottom:18px}
.contact .rows{display:grid;gap:10px;max-width:460px}
.contact .btn{background:var(--band-btn);border-color:var(--band-line);color:var(--band-ink)}
.contact .btn:hover{border-color:var(--band-ink2);background:var(--band-line)}
.contact .btn.primary{background:var(--red);border-color:var(--red);color:#fff;width:100%;font-size:1.05rem;padding:12px 16px}
.contact .btn.primary:hover{background:#a80d26;border-color:#a80d26}
.contact .btns .btn{flex:1 1 0}
.tb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1.5px solid var(--band-ink);font:500 .78rem "JetBrains Mono",monospace}
.tb > div{padding:5px 8px;border-right:1px solid var(--band-ink);border-bottom:1px solid var(--band-ink);min-width:0;overflow-wrap:anywhere}
.tb > div:nth-child(4n){border-right:0}
.tb > div.last{border-bottom:0}
.tb span{display:block;color:var(--band-ink2);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em}
.tb .title{grid-column:span 3;font:600 .95rem Barlow}
.tb .title b{display:block;font-size:1.05rem}
.tb .proj{display:grid;place-items:center}
.tb .ok{color:#4ade80;font-weight:600}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{color:var(--yellow)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

  approach:{en:["Trained agents in Unity ML-Agents on increasingly crowded 3D layouts, with the difficulty raised automatically as they improved.","Gave the agent a hint: the shortest route a simple grid search can find. It is not rewarded for following it, so it can leave it when there is a better way.","Turned a CAD model of an engine bay into a voxel grid and ran the trained model in plain Python, so it works without Unity.","Compared every version on the same 90 test routes and checked the differences with a paired statistical test (McNemar)."],

  next:{en:"Real harnesses have hundreds of cables, and then the hard part is no longer a single route but the order. A cable routed early can block the ones that come after it, so choosing the order becomes an optimization problem of its own. The next step is to let the system decide which cable to route first, and to compare the result with industrial cable tools such as IPS from Fraunhofer-Chalmers Centre.",sv:"Riktiga kablage har hundratals kablar, och då är det svåra inte längre en enskild väg utan ordningen. En kabel som dras tidigt kan blockera de som kommer efter, så att välja ordning blir ett eget optimeringsproblem. Nästa steg är att låta systemet avgöra vilken kabel som ska dras först, och att jämföra resultatet med industriella kabelverktyg som IPS från Fraunhofer-Chalmers Centre."},

 {slug:"speed-bump", status:"ship", hidden:true, /* hidden until "My part" is written by Kais */
  title:{en:"Kinematics and strength of a dynamic speed bump",sv:"Kinematik och hållfasthet hos ett dynamiskt farthinder"},
  short:{en:"Bachelor's thesis: how the flap and cylinder of Actibump, a speed bump that drops for drivers within the limit, move together, what its worst load case is and whether it survives it.",sv:"Kandidatarbete: hur luckan och cylindern i Actibump, ett farthinder som fälls ner för den som håller hastigheten, rör sig tillsammans, vilket lastfall som är värst och om farthindret klarar det."},
  tilep:{en:"Rigid-body kinematics and a worst-case strength check in MATLAB. No plastic deformation, no buckling.",sv:"Stelkroppskinematik och en hållfasthetskontroll för värsta lastfall i MATLAB. Ingen plastisk deformation, ingen knäckning."},
  period:"2024", ctx:{en:"Bachelor's thesis, 18 credits (TMMT31), Linköping University. An independent study of Edeva's Actibump; Edeva did not take part and declined to share drawings.",sv:"Kandidatarbete, 18 hp (TMMT31), Linköpings universitet. En fristående studie av Edevas Actibump; Edeva deltog inte och ville inte lämna ut ritningar."},
  role:{en:"One of three authors",sv:"En av tre författare"}, tools:["MATLAB (ode45)","Rigid-body kinematics","Strength of materials"],
  problem:{en:"Actibump stays level for drivers within the speed limit and drops its flap for those who are too fast. If the flap has not dropped when a wheel arrives, the wheel hits it. We wanted to know how the flap and the cylinder that lowers it move together, which load case is the worst, and whether the parts survive it.",
           sv:"Actibump ligger plant för den som håller hastigheten och fäller ner luckan för den som kör för fort. Har luckan inte hunnit fällas ner när hjulet kommer, slår hjulet i den. Vi ville veta hur luckan och cylindern som fäller den rör sig tillsammans, vilket lastfall som är värst och om delarna klarar det."},
  approach:{en:["Built a 2D geometric model of the flap, cylinder, support legs and chain. Since Edeva declined to share drawings, the dimensions come from measurements of a real installation in Linköping.","Derived how the flap angle, the contact point and the drop depend on the cylinder angle, and solved the expressions in MATLAB.","Modeled a 4,000 kg vehicle as a rigid body, solved its motion over the flap with ode45 and estimated the impact with the impulse laws, using a factor of 2 on the impact force to stay conservative.","Checked the worst case by hand: Euler buckling for the support legs, beam elementary cases for the flap, and the force in the chain that drives the cylinders."],
            sv:["Byggde en geometrisk 2D-modell av luckan, cylindern, stödbenen och kedjan. Eftersom Edeva inte ville lämna ut ritningar kommer måtten från mätningar på ett riktigt farthinder i Linköping.","Härledde hur luckans vinkel, kontaktpunkten och nedfällningen beror på cylinderns vinkel, och löste uttrycken i MATLAB.","Modellerade ett fordon på 4 000 kg som en stel kropp, löste dess rörelse över luckan med ode45 och uppskattade stöten med impulslagarna, med en faktor 2 på stötkraften för att hålla resultatet konservativt.","Kontrollerade värsta lastfallet för hand: Eulers knäckfall för stödbenen, elementarfall för luckan och kraften i kedjan som driver cylindrarna."]},
  resultText:{en:"The worst case is when the flap has not dropped before the wheel arrives. The normal force on the flap then reaches about 50 kN, including the safety factor of 2, at a flap angle of 15° and a cylinder angle of 196°. The support legs and the chain carry it with no plastic deformation and no buckling, and every part has a good margin to fracture. The flap angle follows a sinusoidal curve in the cylinder angle, and a larger eccentricity gives a deeper drop.",

/* ===== email: copy to clipboard and confirm, so a click never feels dead ===== */
const toast=document.getElementById("toast"); let toastTimer;
function showToast(){
  toast.textContent=`${U("copied")}: ${EMAIL}`;
  toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"),5000);
}
document.addEventListener("click",e=>{
  const a=e.target.closest(".js-email"); if(!a) return;
  e.preventDefault();
  const done=()=>showToast();
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(EMAIL).then(done,done);
  else { const t=document.createElement("textarea"); t.value=EMAIL; document.body.appendChild(t); t.select(); try{document.execCommand("copy")}catch(_){} t.remove(); done(); }
});

/* ===== recordings: only the one nearest the middle of the screen plays, and only once it is well in view ===== */
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ticking=false;
function pickPlaying(){
  ticking=false;
  const vh=innerHeight, mid=vh/2, imgs=[...document.querySelectorAll("img[data-anim]")];
  let best=null, bestD=Infinity;
  for(const img of imgs){
    const r=img.getBoundingClientRect(); if(!r.height) continue;
    const seen=Math.max(0,Math.min(r.bottom,vh)-Math.max(r.top,0))/r.height;
    const big=r.height>vh*.4, d=Math.abs((r.top+r.bottom)/2-mid);
    // small thumbnails must be fully in view and close to the middle; large media mostly in view
    if(seen>=(big?.85:.95) && d<=vh*(big?.2:.18) && d<bestD){best=img;bestD=d}
  }
  for(const img of imgs){
    const want=img===best?img.dataset.anim:img.dataset.still;
    if(img.getAttribute("src")!==want) img.src=want;
  }
}
function wireThumbs(){ if(!reduceMotion&&!ticking){ticking=true;requestAnimationFrame(pickPlaying)} }
if(!reduceMotion){
  addEventListener("scroll",wireThumbs,{passive:true});
  addEventListener("resize",wireThumbs);
  document.addEventListener("load",e=>{if(e.target.tagName==="IMG")wireThumbs()},true); // layout shifts as images arrive
}

  const names=L(UI.nav);
  document.getElementById("navlinks").innerHTML=ROUTES.map((r,i)=>`<a href="${r}" class="${h.startsWith(r)?"on":""}">${names[i]}</a>`).join("");

}
