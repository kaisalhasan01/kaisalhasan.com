/* ===== email: copy to clipboard and confirm, so a click never feels dead ===== */
const toast=document.getElementById("toast"); let toastTimer;
function showToast(){
  toast.textContent=`${U("copied")}: ${EMAIL}`;
  toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"),5000);
}
document.addEventListener("click",e=>{
  const a=e.target.closest(".js-email"); if(!a) return;
  e.preventDefault();
  const done=()=>showToast();
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(EMAIL).then(done,done);
  else { const t=document.createElement("textarea"); t.value=EMAIL; document.body.appendChild(t); t.select(); try{document.execCommand("copy")}catch(_){} t.remove(); done(); }
});

/* ===== hover-to-play thumbnails ===== */
const canHover=matchMedia("(hover: hover)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
function wireThumbs(){
  if(!canHover) return;
  document.querySelectorAll("img[data-anim]").forEach(img=>{
    const host=img.closest("a")||img;
    new Image().src=img.dataset.anim; // preload so playback starts at once
    host.addEventListener("mouseenter",()=>{img.src=img.dataset.anim});
    host.addEventListener("mouseleave",()=>{img.src=img.dataset.still});
  });
}

/* ===== router ===== */
const ROUTES=["#/projects","#/experience","#/leadership","#/about"];
function render(){
  const h=location.hash||"#/";
  let html;
  if(h.startsWith("#/projects/")) html=projectPage(h.split("/")[2]);
  else if(h==="#/projects") html=projectsPage();
  else if(h==="#/experience") html=experiencePage();
  else if(h==="#/leadership") html=leadershipPage();
  else if(h==="#/about") html=aboutPage();
  else html=home();
  document.getElementById("app").innerHTML=html;
  document.querySelectorAll("[data-ui]").forEach(e=>e.textContent=U(e.dataset.ui));
  const names=L(UI.nav);
  document.getElementById("navlinks").innerHTML=ROUTES.map((r,i)=>`<a href="${r}" class="${h.startsWith(r)?"on":""}">${names[i]}</a>`).join("");
  document.documentElement.lang=lang;
  document.getElementById("lang-en").setAttribute("aria-pressed",lang==="en");
  document.getElementById("lang-sv").setAttribute("aria-pressed",lang==="sv");
  document.title = h==="#/"||h==="" ? "Kais Alhasan" : (document.querySelector("h1")?.textContent||"")+" · Kais Alhasan";
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.querySelectorAll(".prow").forEach(c=>c.style.display=(b.dataset.f==="all"||c.dataset.s===b.dataset.f)?"":"none");
  });
  document.querySelectorAll(".playhint").forEach(e=>e.hidden=!canHover);
  wireThumbs();
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);nav.classList.remove("hide")});
const nav=document.getElementById("topnav"); let lastY=scrollY;
addEventListener("scroll",()=>{const y=scrollY; if(y>lastY+6&&y>120) nav.classList.add("hide"); else if(y<lastY-6||y<120) nav.classList.remove("hide"); lastY=y;},{passive:true});
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){};render()}
document.getElementById("lang-en").onclick=()=>setLang("en");
document.getElementById("lang-sv").onclick=()=>setLang("sv");
document.getElementById("theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"};
render();
</script>
